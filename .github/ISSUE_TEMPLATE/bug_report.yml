name: Bug report
description: Something doesn't work as expected
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting! English or German is fine.
        **Please don't post real personal data** – replace names, addresses etc. before attaching files or screenshots.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open …
        2. Enter …
        3. Click "Download PDF"
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Affected part
      options:
        - Web app
        - "@scorrrpy/cv-studio (editor library)"
        - "@scorrrpy/cv-engine (PDF / data model)"
        - Not sure
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Browser / OS or package version
      placeholder: e.g. Firefox 140 on Windows 11, or @scorrrpy/cv-engine 0.1.3 on Node 22
  - type: textarea
    id: files
    attributes:
      label: Sample file, screenshots, logs
      description: A minimal `.cv.json` (with fake data) that shows the problem helps most.
